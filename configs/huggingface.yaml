# In-process Hugging Face models (transformers + sentence-transformers).
# Model ids are downloaded from the Hub on first use; local paths work too.
# For large corpora prefer serving the model with vLLM (configs/vllm.yaml):
# it is much faster than transformers' generate().

llm:
  provider: huggingface
  model: Qwen/Qwen2.5-7B-Instruct # any chat model with a chat template, or a local path
  device: auto                    # auto (all GPUs via accelerate) | cuda | cuda:1 | mps | cpu
  dtype: bfloat16                 # auto | bfloat16 | float16 | float32
  # quantization: 4bit            # 4bit | 8bit (needs bitsandbytes)
  temperature: 0.0
  max_tokens: 2048
  batch_size: 8                   # dynamic batching of concurrent requests (1 = off)
  batch_wait_ms: 50
  concurrency: 8                  # requests the indexer may queue at once (>= batch_size)
  trust_remote_code: false
  # chat_template_kwargs: {enable_thinking: false}   # Qwen3-style templates
  # model_kwargs: {attn_implementation: sdpa}

embedding:
  provider: huggingface
  model: BAAI/bge-m3              # e.g. Qwen/Qwen3-Embedding-0.6B, intfloat/multilingual-e5-large
  device: auto
  dtype: auto
  batch_size: 32
  max_tokens: 8192
  hf_backend: auto                # sentence_transformers | transformers
  # e5 models:  query_prefix: "query: "   document_prefix: "passage: "
